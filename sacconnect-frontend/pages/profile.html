<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Profile Page</title>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>
    <header>
      <nav class="navigation">
        <a href="index.html">Home</a> |
        <a href="profile.html">Profile</a> |
        <a href="chat.html">Messages</a> |
        <a href="#" id="logoutLink">Logout</a>
      </nav>
    </header>

    <div class="profile-container">
      <div class="profile-header">
        
        <img src="avatar.jpg" alt="User Avatar" class="profile-avatar">

        
        <h1 class="profile-name" id="profileName">Username</h1>

        <button class="report-button" id="editProfileButton">Edit Profile</button> 

        <button class="report-button" id="reportUserButton">Report User</button>
      </div>

      <div class="profile-bio">
        <p id="profileBio">Bio</p>
      </div>

      <div class="profile-stats">
        <span id="postsStat">Posts: 0</span>
        <span id="followersStat">Followers: 0</span>
        <span id="followingStat">Following: 0</span>
      </div>
    </div>
    <div class="report-overlay"></div>
    <div class="report-popup" id="reportPopup">
      <h3>Report User</h3>
      <textarea id="reportReason" rows="4" cols="50" placeholder="Write your report here:"></textarea><br>

      <button id="closeReport" class="report-button">Cancel</button>
      <button id="sendReport" class ="report-button">Submit Report</button>
    </div>
    

    <script>
      const logoutLink = document.getElementById('logoutLink');
      const editProfileButton = document.getElementById('editProfileButton');
      const profileNameEl = document.getElementById('profileName');
      const profileBioEl = document.getElementById('profileBio');

      const userId = localStorage.getItem('userId');
      const userEmail = localStorage.getItem('userEmail');

      const reportButton = document.getElementById('reportUserButton');
      const popup = document.getElementById('reportPopup');
      const overlay = document.querySelector('.report-overlay');
      const closeBtn = document.getElementById('closeReport');
      const sendBtn = document.getElementById('sendReport');
      const reasonBox = document.getElementById('reportReason');

      reportButton.addEventListener('click', () => {
        popup.style.display = 'block';
        overlay.style.display = 'flex';
      });

      closeBtn.addEventListener('click', () => {
        popup.style.display = 'none';
        overlay.style.display = 'none';
      });


      overlay.addEventListener('click', () => {
        popup.style.display = 'none';
        overlay.style.display = 'none';
      });

      sendBtn.addEventListener('click', async () => {
        const reason = reasonBox.value.trim();
        if (reason === '') {
          alert("You must enter a reason!");
          return;
        }

        console.log("Report submitted:", reason);

        alert("Report submitted!");
        popup.style.display = 'none';
        overlay.style.display = 'none';
        reasonBox.value = "";
      });


      if (!userId || !userEmail) {
        window.location.href = '../login.html';
      }

      logoutLink.addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('userId');
        localStorage.removeItem('userEmail');
        window.location.href = '../login.html';
      });


      editProfileButton.addEventListener('click', () => {
        window.location.href = './edit-profile.html';
      });


      async function loadProfile() {
        try {
          const response = await fetch(`http://localhost:8080/api/users/${userId}`);

          if (!response.ok) {
            console.error('Failed to load profile:', await response.text());
            return;
          }

          const user = await response.json();

        
          profileNameEl.textContent = user.name || 'Student';
          profileBioEl.textContent = user.bio && user.bio.trim() !== ''
            ? user.bio
            : 'No bio yet. Click "Edit Profile" to add one.';

        } catch (err) {
          console.error('Error loading profile:', err);
        }
      }

      loadProfile();
    </script>
  </body>
</html>
